name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write # OIDC: no AWS keys are stored in the repository
  contents: read

env:
  ENVIRONMENT: staging
  AWS_REGION: eu-west-2

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push the API and worker images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          for app in api worker; do
            REPO="$REGISTRY/menu-studio-$ENVIRONMENT-$app"
            docker build -f "apps/$app/Dockerfile" -t "$REPO:$TAG" -t "$REPO:latest" .
            docker push "$REPO:$TAG"
            docker push "$REPO:latest"
          done
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Deploy the stacks
        run: pnpm --filter @menu-studio/infra exec cdk deploy --all --require-approval never -c environment=$ENVIRONMENT -c imageTag=$IMAGE_TAG

      - name: Read the stack outputs
        id: outputs
        run: |
          set -euo pipefail
          get() { aws cloudformation describe-stacks --stack-name "$1" --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text; }
          echo "web_bucket=$(get MenuStudio-$ENVIRONMENT-Web WebBucketName)" >> "$GITHUB_OUTPUT"
          echo "web_distribution=$(get MenuStudio-$ENVIRONMENT-Web WebDistributionId)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(get MenuStudio-$ENVIRONMENT-Api ApiUrl)" >> "$GITHUB_OUTPUT"

      - name: Build the owner app against the deployed API
        env:
          VITE_API_URL: ${{ steps.outputs.outputs.api_url }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_ENVIRONMENT: staging
        run: |
          pnpm fonts:mirror
          pnpm --filter @menu-studio/web build

      - name: Sync the owner app
        env:
          BUCKET: ${{ steps.outputs.outputs.web_bucket }}
          DISTRIBUTION: ${{ steps.outputs.outputs.web_distribution }}
        run: |
          set -euo pipefail
          # Hashed assets first and long-lived, then index.html, so a page never loads assets that
          # are not there yet.
          aws s3 sync apps/web/dist "s3://$BUCKET" --delete --exclude index.html --cache-control "public, max-age=31536000, immutable"
          aws s3 cp apps/web/dist/index.html "s3://$BUCKET/index.html" --cache-control "public, max-age=0, must-revalidate"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/index.html" "/"

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Smoke test
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "${{ steps.outputs.outputs.api_url }}/health"
